name: Firmware and control tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - run: pio test -e native
      - run: pio run -e nodemcuv2
      - name: Check real AccelStepper motion timing with simulated clock
        run: |
          g++ -std=c++11 -Wall -Wextra -DARDUINO=100 -Itools/motion_sim -Iinclude -I.pio/libdeps/nodemcuv2/AccelStepper/src tools/motion_sim/main.cpp .pio/libdeps/nodemcuv2/AccelStepper/src/AccelStepper.cpp -o /tmp/motion-sim
          /tmp/motion-sim
