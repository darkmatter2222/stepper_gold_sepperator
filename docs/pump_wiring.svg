<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><rect width="1280" height="1040" fill="#f7fafc"/><text x="35" y="40" font-family="Arial,sans-serif" font-size="28" fill="#193448">KAMOER 12 V / 5 W • switch built from your inventory</text><text x="35" y="74" font-family="Arial,sans-serif" font-size="20" fill="#193448">IRF9540N P-channel + 2N3904 NPN + 1N5822 • D1 HIGH = ON; LOW / reset = OFF</text><text x="35" y="108" font-family="Arial,sans-serif" font-size="18" fill="#193448">Logical terminal map: connect the labeled pins. Box positions are NOT physical lead order.</text><text x="710" y="151" font-family="Arial,sans-serif" font-size="20" fill="#193448">Fused regulated +12 V</text><path d="M700,175 L1190,175" fill="none" stroke="#ba3434" stroke-width="3"/><path d="M700,175 L700,210" fill="none" stroke="#ba3434" stroke-width="3"/><rect x="615" y="210" width="210" height="140" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="635" y="240" font-family="Arial,sans-serif" font-size="18" fill="#193448">S • pin 3</text><text x="635" y="275" font-family="Arial,sans-serif" font-size="21" fill="#193448">Q1 IRF9540N</text><text x="635" y="305" font-family="Arial,sans-serif" font-size="18" fill="#193448">G • pin 1</text><text x="635" y="333" font-family="Arial,sans-serif" font-size="18" fill="#193448">D • pin 2 / tab</text><path d="M700,350 L700,405" fill="none" stroke="#ba3434" stroke-width="3"/><path d="M700,385 L1070,385" fill="none" stroke="#ba3434" stroke-width="3"/><text x="830" y="365" font-family="Arial,sans-serif" font-size="18" fill="#193448">SWITCHED + (pump +)</text><rect x="625" y="405" width="150" height="95" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="645" y="438" font-family="Arial,sans-serif" font-size="22" fill="#193448">Kamoer</text><text x="647" y="466" font-family="Arial,sans-serif" font-size="18" fill="#193448">12 V / 5 W</text><text x="680" y="490" font-family="Arial,sans-serif" font-size="20" fill="#193448">−</text><path d="M700,500 L700,660" fill="none" stroke="#234e70" stroke-width="3"/><path d="M70,660 L1190,660" fill="none" stroke="#234e70" stroke-width="3"/><text x="580" y="691" font-family="Arial,sans-serif" font-size="20" fill="#193448">COMMON GND • supply − / NodeMCU / stepper</text><path d="M510,175 L700,175" fill="none" stroke="#ba3434" stroke-width="3"/><path d="M510,175 L510,218" fill="none" stroke="#234e70" stroke-width="3"/><rect x="466" y="218" width="88" height="38" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="473" y="243" font-family="Arial,sans-serif" font-size="17" fill="#193448">R3 10k</text><path d="M510,256 L510,295" fill="none" stroke="#234e70" stroke-width="3"/><path d="M510,295 L615,295" fill="none" stroke="#234e70" stroke-width="3"/><circle cx="510" cy="295" r="5" fill="#234e70"/><path d="M400,295 L510,295" fill="none" stroke="#234e70" stroke-width="3"/><path d="M400,295 L400,335" fill="none" stroke="#234e70" stroke-width="3"/><rect x="360" y="335" width="80" height="38" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="367" y="360" font-family="Arial,sans-serif" font-size="17" fill="#193448">R4 1k</text><path d="M400,373 L400,445" fill="none" stroke="#234e70" stroke-width="3"/><rect x="335" y="445" width="195" height="115" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="354" y="470" font-family="Arial,sans-serif" font-size="17" fill="#193448">C</text><text x="355" y="500" font-family="Arial,sans-serif" font-size="21" fill="#193448">Q2 2N3904</text><text x="354" y="527" font-family="Arial,sans-serif" font-size="17" fill="#193448">B</text><text x="392" y="549" font-family="Arial,sans-serif" font-size="17" fill="#193448">E</text><path d="M400,560 L400,660" fill="none" stroke="#234e70" stroke-width="3"/><circle cx="400" cy="660" r="5" fill="#234e70"/><text x="40" y="460" font-family="Arial,sans-serif" font-size="20" fill="#193448">NodeMCU</text><text x="40" y="489" font-family="Arial,sans-serif" font-size="20" fill="#193448">D1 / GPIO5</text><path d="M45,520 L135,520" fill="none" stroke="#234e70" stroke-width="3"/><rect x="135" y="502" width="105" height="36" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="143" y="527" font-family="Arial,sans-serif" font-size="17" fill="#193448">R1 4.7k</text><path d="M240,520 L335,520" fill="none" stroke="#234e70" stroke-width="3"/><path d="M275,520 L275,580" fill="none" stroke="#234e70" stroke-width="3"/><rect x="230" y="580" width="90" height="38" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="237" y="605" font-family="Arial,sans-serif" font-size="17" fill="#193448">R2 100k</text><path d="M275,618 L275,660" fill="none" stroke="#234e70" stroke-width="3"/><circle cx="275" cy="520" r="5" fill="#234e70"/><circle cx="275" cy="660" r="5" fill="#234e70"/><path d="M900,385 L900,425" fill="none" stroke="#234e70" stroke-width="3"/><rect x="884" y="425" width="32" height="85" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><rect x="885" y="435" width="30" height="9" fill="#234e70"/><path d="M900,510 L900,660" fill="none" stroke="#234e70" stroke-width="3"/><circle cx="900" cy="385" r="5" fill="#234e70"/><circle cx="900" cy="660" r="5" fill="#234e70"/><text x="928" y="434" font-family="Arial,sans-serif" font-size="18" fill="#193448">1N5822</text><text x="928" y="463" font-family="Arial,sans-serif" font-size="17" fill="#193448">BAND ↑</text><text x="928" y="491" font-family="Arial,sans-serif" font-size="17" fill="#193448">Anode → GND</text><path d="M1070,385 L1070,555" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1053,555 L1087,555" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1053,570 L1087,570" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1070,570 L1070,660" fill="none" stroke="#234e70" stroke-width="3"/><text x="928" y="600" font-family="Arial,sans-serif" font-size="17" fill="#193448">100 nF</text><text x="928" y="623" font-family="Arial,sans-serif" font-size="17" fill="#193448">at pump</text><circle cx="1070" cy="660" r="5" fill="#234e70"/><path d="M1190,175 L1190,280" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1173,280 L1207,280" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1173,295 L1207,295" fill="none" stroke="#234e70" stroke-width="3"/><path d="M1190,295 L1190,660" fill="none" stroke="#234e70" stroke-width="3"/><text x="1163" y="270" font-family="Arial,sans-serif" font-size="20" fill="#193448">+</text><text x="980" y="220" font-family="Arial,sans-serif" font-size="18" fill="#193448">100 µF / 25 V</text><text x="980" y="246" font-family="Arial,sans-serif" font-size="17" fill="#193448">+ to fused 12 V</text><text x="980" y="272" font-family="Arial,sans-serif" font-size="17" fill="#193448">− to GND</text><circle cx="700" cy="175" r="5" fill="#234e70"/><circle cx="700" cy="385" r="5" fill="#234e70"/><circle cx="700" cy="660" r="5" fill="#234e70"/><rect x="35" y="720" width="1210" height="150" rx="6" fill="white" stroke="#45687a" stroke-width="2"/><text x="55" y="751" font-family="Arial,sans-serif" font-size="20" fill="#193448">PARTS: 1× IRF9540N, 1× 2N3904, 1× 1N5822; 4.7k, 100k, 10k, 1k resistors (¼ W).</text><text x="55" y="785" font-family="Arial,sans-serif" font-size="19" fill="#193448">IRF9540N: printed face toward you, leads down → G / D / S. Metal tab = switched pump +.</text><text x="55" y="817" font-family="Arial,sans-serif" font-size="19" fill="#193448">2N3904: typical TO-92 flat face / leads down → E / B / C; verify your actual maker or tester.</text><text x="55" y="849" font-family="Arial,sans-serif" font-size="19" fill="#193448">Diode BAND goes to pump + / Q1 drain, NOT the constant +12 V rail. Pump − goes to GND.</text><text x="35" y="907" font-family="Arial,sans-serif" font-size="20" fill="#193448">Use existing slow ON/OFF bursts only. This resistor gate drive is not for high-frequency PWM.</text><text x="35" y="941" font-family="Arial,sans-serif" font-size="19" fill="#193448">Keep pump current off breadboard rails. Fit flyback diode close to pump; measure startup current.</text><text x="35" y="975" font-family="Arial,sans-serif" font-size="19" fill="#193448">Before connecting pump: LOW/reset → gate ≈12 V; HIGH → gate ≈1.3 V (relative to GND).</text><text x="35" y="1009" font-family="Arial,sans-serif" font-size="19" fill="#193448">Power NodeMCU through the existing L7805 5 V circuit. Disconnect external VIN before USB.</text></svg>