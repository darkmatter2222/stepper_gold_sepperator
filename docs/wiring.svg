<svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" width="1280" height="2810" viewBox="0 0 1280 2810"><g transform="translate(0 0)"><ns0:rect width="1280" height="1150" fill="#f7fafc" /><ns0:text x="35" y="40" font-family="Arial,sans-serif" font-size="28" fill="#193448">POWER FIRST | Shared 12 V → L7805 → 5 V VIN</ns0:text><ns0:text x="35" y="75" font-family="Arial,sans-serif" font-size="18" fill="#193448">Logical nets, not hole positions. Verify L7805 TO-220 marking and NodeMCU VIN before connection.</ns0:text><ns0:rect x="35" y="110" width="1210" height="90" rx="8" fill="white" stroke="#45687a" stroke-width="2" /><ns0:text x="55" y="142" font-family="Arial,sans-serif" font-size="20" fill="#193448">PHOTO ORIENTATION: NodeMCU USB connector at left</ns0:text><ns0:text x="55" y="178" font-family="Arial,sans-serif" font-size="22" fill="#193448">UPPER red rail = +5 V     LOWER red rail = +12 V     BOTH blue rails = common GND</ns0:text><ns0:rect x="450" y="245" width="285" height="120" rx="8" fill="white" stroke="#45687a" stroke-width="2" /><ns0:text x="475" y="275" font-family="Arial,sans-serif" font-size="23" fill="#193448">L7805 TO-220</ns0:text><ns0:text x="470" y="310" font-family="Arial,sans-serif" font-size="20" fill="#193448">1 IN      2 GND      3 OUT</ns0:text><ns0:text x="477" y="342" font-family="Arial,sans-serif" font-size="18" fill="#193448">Heatsink / tab = GND</ns0:text><ns0:path d="M60,300 L450,300" stroke="#c94242" stroke-width="3" fill="none" /><ns0:text x="60" y="250" font-family="Arial,sans-serif" font-size="20" fill="#193448">Lower rail: +12 V</ns0:text><ns0:path d="M735,300 L1185,300" stroke="#b26d18" stroke-width="3" fill="none" /><ns0:text x="810" y="250" font-family="Arial,sans-serif" font-size="20" fill="#193448">Upper rail: +5 V → NodeMCU VIN</ns0:text><ns0:path d="M590,365 L590,445" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M60,445 L1185,445" stroke="#303d47" stroke-width="3" fill="none" /><ns0:text x="60" y="480" font-family="Arial,sans-serif" font-size="20" fill="#193448">Common GND → supply −, both blue rails, NodeMCU GND, driver GND and pump return</ns0:text><ns0:path d="M180,300 L180,345" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M165,345 L195,345" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M165,355 L195,355" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M180,355 L180,445" stroke="#303d47" stroke-width="3" fill="none" /><ns0:text x="200" y="375" font-family="Arial,sans-serif" font-size="16" fill="#193448">330 nF / ≥25 V</ns0:text><ns0:path d="M810,300 L810,345" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M795,345 L825,345" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M795,355 L825,355" stroke="#303d47" stroke-width="3" fill="none" /><ns0:path d="M810,355 L810,445" stroke="#303d47" stroke-width="3" fill="none" /><ns0:text x="830" y="375" font-family="Arial,sans-serif" font-size="16" fill="#193448">100 nF / ≥16 V</ns0:text><ns0:text x="65" y="525" font-family="Arial,sans-serif" font-size="20" fill="#193448">Both ceramic capacitors sit directly beside the regulator pins; connect their other ends to GND.</ns0:text><ns0:rect x="35" y="555" width="1210" height="165" rx="8" fill="white" stroke="#45687a" stroke-width="2" /><ns0:text x="55" y="590" font-family="Arial,sans-serif" font-size="20" fill="#193448">AT VIN: 10 µF / ≥16 V electrolytic (+ to 5 V, − to GND) and 1k / 0.25 W load (5 V to GND).</ns0:text><ns0:text x="55" y="625" font-family="Arial,sans-serif" font-size="20" fill="#193448">PIN VIEW: printed face toward you, leads down → LEFT 1 IN / CENTER 2 GND / RIGHT 3 OUT.</ns0:text><ns0:text x="55" y="660" font-family="Arial,sans-serif" font-size="20" fill="#193448">Three regulator leads must occupy separate contact strips. Metal-back view reverses left/right.</ns0:text><ns0:text x="55" y="695" font-family="Arial,sans-serif" font-size="20" fill="#193448">Keep the grounded heatsink clear of live pins. Check split rails; never join +12 V to +5 V.</ns0:text><ns0:rect x="35" y="745" width="1210" height="165" rx="8" fill="white" stroke="#45687a" stroke-width="2" /><ns0:text x="55" y="782" font-family="Arial,sans-serif" font-size="21" fill="#193448">12 V SUPPLY DISTRIBUTION: fuse branches appropriately; share a common ground point.</ns0:text><ns0:text x="55" y="820" font-family="Arial,sans-serif" font-size="20" fill="#193448">Separate secure wires → A4988 VMOT and pump +12 V; separate power returns to supply −.</ns0:text><ns0:text x="55" y="855" font-family="Arial,sans-serif" font-size="20" fill="#193448">Breadboard +12 V feeds only the regulator branch. Do not route motor/pump current through rails.</ns0:text><ns0:text x="55" y="890" font-family="Arial,sans-serif" font-size="20" fill="#193448">Keep local 100 µF / 25 V bulk capacitors at VMOT and pump switch (see diagrams below).</ns0:text><ns0:text x="35" y="955" font-family="Arial,sans-serif" font-size="21" fill="#193448">3V3 stays separate: NodeMCU 3V3 → A4988 VDD, MS1/2/3, RESET/SLEEP and EN pull-up.</ns0:text><ns0:text x="35" y="995" font-family="Arial,sans-serif" font-size="21" fill="#193448">USB: disconnect external VIN lead before attaching USB; unplug USB before reconnecting VIN.</ns0:text><ns0:text x="35" y="1035" font-family="Arial,sans-serif" font-size="20" fill="#193448">TEST: verify 12 V and 5 V before connecting NodeMCU; then verify its 3V3 and regulator temperature.</ns0:text><ns0:text x="35" y="1075" font-family="Arial,sans-serif" font-size="20" fill="#193448">HEAT: (12 − 5) × load current = 1.4 W at 200 mA, plus internal loss. Validate heatsink under load.</ns0:text><ns0:text x="35" y="1115" font-family="Arial,sans-serif" font-size="20" fill="#193448">Button: D2 to GND only when pressed. Verify tactile-switch pairs by continuity, not appearance.</ns0:text></g><g transform="translate(0 1150)"><ns0:rect width="1280" height="930" fill="#f7fafc" />
<ns0:text x="35" y="40" font-family="Arial,sans-serif" font-size="28" fill="#193448">NodeMCU ESP8266 + A4988 + one button</ns0:text>
<ns0:text x="35" y="73" font-family="Arial,sans-serif" font-size="16" fill="#193448">Logical connections only. Verify driver model and pin labels; this is NOT the physical carrier pin order.</ns0:text>
<ns0:rect x="35" y="110" width="310" height="340" rx="10" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="50" y="140" font-family="Arial,sans-serif" font-size="21" fill="#193448">NodeMCU ESP-12E</ns0:text>
<ns0:rect x="500" y="110" width="310" height="570" rx="10" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="515" y="140" font-family="Arial,sans-serif" font-size="21" fill="#193448">A4988 (verify chip)</ns0:text>
<ns0:text x="55" y="173" font-family="Arial,sans-serif" font-size="18" fill="#193448">D5 / GPIO14</ns0:text>
<ns0:text x="518" y="173" font-family="Arial,sans-serif" font-size="18" fill="#193448">STEP</ns0:text>
<ns0:polyline points="345,180 500,180" fill="none" stroke="#1c7fa0" stroke-width="3" />
<ns0:text x="55" y="218" font-family="Arial,sans-serif" font-size="18" fill="#193448">D6 / GPIO12</ns0:text>
<ns0:text x="518" y="218" font-family="Arial,sans-serif" font-size="18" fill="#193448">DIR</ns0:text>
<ns0:polyline points="345,225 500,225" fill="none" stroke="#8264ac" stroke-width="3" />
<ns0:text x="55" y="263" font-family="Arial,sans-serif" font-size="18" fill="#193448">D7 / GPIO13</ns0:text>
<ns0:text x="518" y="263" font-family="Arial,sans-serif" font-size="18" fill="#193448">EN (active LOW)</ns0:text>
<ns0:polyline points="345,270 500,270" fill="none" stroke="#b26d18" stroke-width="3" />
<ns0:text x="55" y="308" font-family="Arial,sans-serif" font-size="18" fill="#193448">3V3</ns0:text>
<ns0:text x="518" y="308" font-family="Arial,sans-serif" font-size="18" fill="#193448">VDD (3.3 V)</ns0:text>
<ns0:polyline points="345,315 500,315" fill="none" stroke="#c94242" stroke-width="3" />
<ns0:text x="55" y="353" font-family="Arial,sans-serif" font-size="18" fill="#193448">GND</ns0:text>
<ns0:text x="518" y="353" font-family="Arial,sans-serif" font-size="18" fill="#193448">Logic GND</ns0:text>
<ns0:polyline points="345,360 500,360" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:text x="55" y="414" font-family="Arial,sans-serif" font-size="18" fill="#193448">D2 / GPIO4</ns0:text>
<ns0:polyline points="345,420 390,420 390,555 285,555" fill="none" stroke="#24799c" stroke-width="3" />
<ns0:rect x="35" y="505" width="250" height="105" rx="10" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="50" y="535" font-family="Arial,sans-serif" font-size="21" fill="#193448">Normally-open button</ns0:text>
<ns0:text x="50" y="580" font-family="Arial,sans-serif" font-size="16" fill="#193448">Press connects D2 to GND</ns0:text>
<ns0:polyline points="35,555 18,555 18,775 1230,775" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:text x="40" y="803" font-family="Arial,sans-serif" font-size="17" fill="#193448">COMMON GROUND: L7805 / NodeMCU GND + driver GND + motor-supply negative</ns0:text>
<ns0:polyline points="425,270 425,150" fill="none" stroke="#b26d18" stroke-width="3" />
<ns0:rect x="418" y="125" width="14" height="25" fill="white" stroke="#b26d18" stroke-width="2" />
<ns0:text x="370" y="104" font-family="Arial,sans-serif" font-size="15" fill="#193448">10k to 3V3</ns0:text>
<ns0:text x="518" y="425" font-family="Arial,sans-serif" font-size="17" fill="#193448">MS1 + MS2 + MS3 → 3V3</ns0:text>
<ns0:text x="518" y="465" font-family="Arial,sans-serif" font-size="17" fill="#193448">RESET + SLEEP → 3V3</ns0:text>
<ns0:text x="518" y="504" font-family="Arial,sans-serif" font-size="16" fill="#193448">Tie all five pins HIGH.</ns0:text>
<ns0:text x="518" y="530" font-family="Arial,sans-serif" font-size="16" fill="#193448">MS pins select 1/16 stepping.</ns0:text>
<ns0:rect x="995" y="140" width="245" height="315" rx="10" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="1010" y="170" font-family="Arial,sans-serif" font-size="21" fill="#193448">Bipolar stepper</ns0:text>
<ns0:text x="740" y="197" font-family="Arial,sans-serif" font-size="17" fill="#193448">1A</ns0:text>
<ns0:polyline points="810,205 995,205" fill="none" stroke="#51865a" stroke-width="3" />
<ns0:text x="1010" y="197" font-family="Arial,sans-serif" font-size="16" fill="#193448">Coil A end 1</ns0:text>
<ns0:text x="740" y="247" font-family="Arial,sans-serif" font-size="17" fill="#193448">1B</ns0:text>
<ns0:polyline points="810,255 995,255" fill="none" stroke="#51865a" stroke-width="3" />
<ns0:text x="1010" y="247" font-family="Arial,sans-serif" font-size="16" fill="#193448">Coil A end 2</ns0:text>
<ns0:text x="740" y="337" font-family="Arial,sans-serif" font-size="17" fill="#193448">2A</ns0:text>
<ns0:polyline points="810,345 995,345" fill="none" stroke="#9b5d86" stroke-width="3" />
<ns0:text x="1010" y="337" font-family="Arial,sans-serif" font-size="16" fill="#193448">Coil B end 1</ns0:text>
<ns0:text x="740" y="387" font-family="Arial,sans-serif" font-size="17" fill="#193448">2B</ns0:text>
<ns0:polyline points="810,395 995,395" fill="none" stroke="#9b5d86" stroke-width="3" />
<ns0:text x="1010" y="387" font-family="Arial,sans-serif" font-size="16" fill="#193448">Coil B end 2</ns0:text>
<ns0:text x="1010" y="435" font-family="Arial,sans-serif" font-size="15" fill="#193448">Find pairs with ohmmeter.</ns0:text>
<ns0:text x="520" y="590" font-family="Arial,sans-serif" font-size="18" fill="#193448">VMOT</ns0:text>
<ns0:text x="520" y="649" font-family="Arial,sans-serif" font-size="18" fill="#193448">Motor GND</ns0:text>
<ns0:rect x="985" y="560" width="255" height="140" rx="10" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="1000" y="590" font-family="Arial,sans-serif" font-size="21" fill="#193448">Shared 12 V</ns0:text>
<ns0:text x="1000" y="620" font-family="Arial,sans-serif" font-size="16" fill="#193448">+12 V (verify suitability)</ns0:text>
<ns0:text x="1000" y="670" font-family="Arial,sans-serif" font-size="16" fill="#193448">Negative / GND</ns0:text>
<ns0:polyline points="810,600 985,600" fill="none" stroke="#c94242" stroke-width="3" />
<ns0:polyline points="810,660 900,660 900,775" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:polyline points="985,675 955,675 955,775" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:polyline points="865,600 865,619" fill="none" stroke="#c94242" stroke-width="3" />
<ns0:polyline points="850,620 880,620" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:polyline points="850,632 880,632" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:polyline points="865,633 865,660" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:text x="875" y="617" font-family="Arial,sans-serif" font-size="16" fill="#193448">+</ns0:text>
<ns0:text x="610" y="716" font-family="Arial,sans-serif" font-size="17" fill="#193448">100 µF, ≥25 V for 12 V supply</ns0:text>
<ns0:text x="610" y="740" font-family="Arial,sans-serif" font-size="16" fill="#193448">Across VMOT/GND, close to driver.</ns0:text>
<ns0:polyline points="470,360 470,775" fill="none" stroke="#303d47" stroke-width="3" />
<ns0:text x="35" y="850" font-family="Arial,sans-serif" font-size="19" fill="#a33333">NodeMCU VIN: regulated 5 V from L7805. Driver logic: 3V3. Disconnect VIN before USB.</ns0:text>
<ns0:text x="35" y="882" font-family="Arial,sans-serif" font-size="17" fill="#193448">Set driver current limit before running. Power OFF before changing motor wiring. OLED is not used.</ns0:text>
<ns0:circle cx="425" cy="270" r="4" fill="#b26d18" /><ns0:circle cx="470" cy="360" r="4" fill="#303d47" /><ns0:circle cx="470" cy="775" r="4" fill="#303d47" /><ns0:circle cx="900" cy="775" r="4" fill="#303d47" /><ns0:circle cx="955" cy="775" r="4" fill="#303d47" /></g><g transform="translate(0 2080)"><ns0:rect width="1280" height="730" fill="#f7fafc" /><ns0:text x="35" y="40" font-family="Arial,sans-serif" font-size="28" fill="#193448">12 V peristaltic pump · AO3400A low-side switch</ns0:text>
<ns0:text x="35" y="73" font-family="Arial,sans-serif" font-size="17" fill="#193448">Logical connections; verify breakout pin labels. All ground symbols/nets are connected.</ns0:text>
<ns0:path d="M700,115 L1130,115" fill="none" stroke="#ba3434" stroke-width="3" />
<ns0:text x="710" y="105" font-family="Arial,sans-serif" font-size="20" fill="#193448">Regulated +12 V</ns0:text>
<ns0:rect x="625" y="155" width="150" height="85" rx="8" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="641" y="190" font-family="Arial,sans-serif" font-size="19" fill="#193448">Kamoer pump</ns0:text>
<ns0:text x="650" y="220" font-family="Arial,sans-serif" font-size="19" fill="#193448">12 V / 5 W</ns0:text>
<ns0:path d="M700,115 L700,155" fill="none" stroke="#ba3434" stroke-width="3" />
<ns0:path d="M700,240 L700,285" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:text x="780" y="265" font-family="Arial,sans-serif" font-size="19" fill="#193448">Pump − / drain</ns0:text>
<ns0:rect x="625" y="335" width="150" height="120" rx="8" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="640" y="365" font-family="Arial,sans-serif" font-size="21" fill="#193448">AO3400A</ns0:text>
<ns0:text x="644" y="391" font-family="Arial,sans-serif" font-size="19" fill="#193448">D = pin 3</ns0:text>
<ns0:text x="644" y="416" font-family="Arial,sans-serif" font-size="19" fill="#193448">G = pin 1</ns0:text>
<ns0:text x="644" y="443" font-family="Arial,sans-serif" font-size="19" fill="#193448">S = pin 2</ns0:text>
<ns0:path d="M700,285 L700,335" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M700,455 L700,515" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M460,515 L1130,515" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:text x="740" y="545" font-family="Arial,sans-serif" font-size="19" fill="#193448">COMMON GND: supply − and NodeMCU GND</ns0:text>
<ns0:rect x="35" y="355" width="220" height="75" rx="8" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="50" y="386" font-family="Arial,sans-serif" font-size="19" fill="#193448">NodeMCU ESP8266</ns0:text>
<ns0:text x="50" y="413" font-family="Arial,sans-serif" font-size="19" fill="#193448">D1 / GPIO5</ns0:text>
<ns0:path d="M255,402 L325,402" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:rect x="325" y="383" width="105" height="38" rx="8" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="337" y="409" font-family="Arial,sans-serif" font-size="19" fill="#193448">330 ohm</ns0:text>
<ns0:path d="M430,402 L625,402" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M495,402 L495,445" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:rect x="455" y="445" width="80" height="36" rx="8" fill="white" stroke="#45687a" stroke-width="2" />
<ns0:text x="466" y="470" font-family="Arial,sans-serif" font-size="19" fill="#193448">100k</ns0:text>
<ns0:path d="M495,481 L495,515" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:circle cx="495" cy="402" r="5" fill="#234e70" />
<ns0:circle cx="495" cy="515" r="5" fill="#234e70" />
<ns0:path d="M900,115 L900,175" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M880,175 L920,175" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M880,210 L900,175 L920,210 Z" fill="white" stroke="#234e70" stroke-width="3" />
