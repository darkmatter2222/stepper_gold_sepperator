<ns0:path d="M700,285 L1080,285" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:text x="923" y="166" font-family="Arial,sans-serif" font-size="17" fill="#193448">Band / cathode</ns0:text>
<ns0:text x="923" y="196" font-family="Arial,sans-serif" font-size="19" fill="#193448">1N5822</ns0:text>
<ns0:text x="923" y="226" font-family="Arial,sans-serif" font-size="17" fill="#193448">Anode</ns0:text>
<ns0:circle cx="900" cy="115" r="5" fill="#234e70" />
<ns0:circle cx="900" cy="285" r="5" fill="#234e70" />
<ns0:circle cx="700" cy="285" r="5" fill="#234e70" />
<ns0:path d="M1080,115 L1080,195" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M1060,195 L1100,195" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M1060,210 L1100,210" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:path d="M1080,210 L1080,285" fill="none" stroke="#234e70" stroke-width="3" />
<ns0:circle cx="1080" cy="115" r="5" fill="#234e70" />
<ns0:text x="1110" y="197" font-family="Arial,sans-serif" font-size="16" fill="#193448">100 nF</ns0:text>
<ns0:text x="1110" y="218" font-family="Arial,sans-serif" font-size="16" fill="#193448">ceramic</ns0:text>
<ns0:text x="35" y="585" font-family="Arial,sans-serif" font-size="19" fill="#193448">Also add 100 µF / 25 V bulk capacitor: + to 12 V, − to common GND near the switch.</ns0:text>
<ns0:text x="35" y="620" font-family="Arial,sans-serif" font-size="19" fill="#193448">NodeMCU VIN uses L7805 5 V (see power diagram). Disconnect VIN before USB.</ns0:text>
<ns0:text x="35" y="655" font-family="Arial,sans-serif" font-size="19" fill="#193448">Use a suitable breakout and secure power wiring; verify startup current and temperature.</ns0:text>
<ns0:text x="35" y="690" font-family="Arial,sans-serif" font-size="19" fill="#193448">Diode band stays at electrical +12 V even if motor leads are swapped to reverse flow.</ns0:text></g></svg>